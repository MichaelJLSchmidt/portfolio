# Production (later): static deploy of the Next.js export at a root domain.
# Do not deploy until the site is ready; each production deploy costs credits,
# branch deploys and Deploy Previews are free.
# MOTION_TOKEN must be added as an environment variable in the Netlify UI (never here).

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Root domain: no base path. NEXT_PUBLIC_PREVIEW stays unset so production is indexable.
  NEXT_PUBLIC_BASE_PATH = ""

# Deploy Previews and branch deploys are previews: keep them out of search engines.
[context.deploy-preview.environment]
  NEXT_PUBLIC_PREVIEW = "1"

[context.branch-deploy.environment]
  NEXT_PUBLIC_PREVIEW = "1"

# Hashed build assets never change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Terrain data changes only when the pipeline is re-run.
[[headers]]
  for = "/terrain/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
