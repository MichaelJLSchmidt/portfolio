<!-- Fig. 1: service landscape. Actors, channels and systems of today's service, and the six
     constraint pins that framed every decision. -->
<style>
  .zone {
    position: absolute;
    border: 1.5px dashed var(--color-paper-ink-2);
    border-radius: 14px;
  }
  .zone > .label-caps {
    position: absolute;
    top: -10px;
    left: 16px;
    padding: 0 8px;
    background: var(--color-paper-dusk);
    color: var(--color-paper-ink-2);
  }
  .head {
    position: absolute;
    top: 26px;
    left: 40px;
  }
  .head p {
    margin-top: 6px;
  }
  .pin {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px 3px 4px;
    border-radius: 999px;
    background: var(--color-moss-ink);
    color: var(--color-paper-dusk);
    font-family: var(--label);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    box-shadow: 0 2px 4px rgb(27 28 24 / 0.25);
  }
  .pin::before {
    content: "";
    width: 14px;
    height: 14px;
    border: 3px solid var(--color-paper-dusk);
    border-radius: 50%;
    background: var(--color-moss-ink);
  }
  .legend {
    position: absolute;
    right: 40px;
    top: 30px;
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .sw {
    width: 22px;
    height: 14px;
    border: 1.5px solid var(--color-ground);
    border-radius: 4px;
    background: #fff;
  }
  .sw.dashed {
    border-style: dashed;
  }
  .sw.dark {
    background: var(--color-ground);
  }
  .limit {
    color: var(--color-alpenglow-ink);
    font-weight: 600;
  }
</style>
<div class="diagram contours">
  <div class="head">
    <h1 class="title">Service landscape, today</h1>
    <p class="label muted">{{landscape.actors}} actors · {{landscape.channels}} channels · {{landscape.systems}} systems · {{landscape.constraints}} constraints</p>
  </div>
  <div class="legend label">
    <span><i class="sw"></i>Actor or channel</span>
    <span><i class="sw dashed"></i>Planned</span>
    <span><i class="sw dark"></i>System</span>
    <span><span class="pin">Pin</span>Constraint</span>
  </div>
  <div class="zone" style="left: 40px; top: 118px; width: 250px; height: 372px"><span class="label-caps">Applicants</span></div>
  <div class="zone" style="left: 340px; top: 118px; width: 270px; height: 372px"><span class="label-caps">Channels</span></div>
  <div class="zone" style="left: 660px; top: 118px; width: 500px; height: 372px"><span class="label-caps">Energy Office &amp; partners</span></div>
  <div class="zone" style="left: 340px; top: 540px; width: 820px; height: 150px"><span class="label-caps">Systems</span></div>
</div>
<script src="/shared/diagram.js"></script>
<script>
  const D = window.DATA;
  const d = Diagram(document.querySelector(".diagram"));
  d.box("owner", { x: 70, y: 160, w: 190, h: 64, html: "Homeowner<small>applies and declares</small>" })
    .box("installer", { x: 70, y: 360, w: 190, h: 64, html: "Installer<small>quotes and fills in</small>" })
    .box("pdf", { x: 370, y: 150, w: 210, h: 56, html: `PDF form<small>${D.pdf.pages} pages, DE or FR</small>` })
    .box("inbox", { x: 370, y: 232, w: 210, h: 56, html: "Shared e-mail inbox<small>attachments, replies</small>" })
    .box("phone", { x: 370, y: 314, w: 210, h: 56, html: "Phone<small>questions, call-backs</small>" })
    .box("agov", { x: 370, y: 404, w: 210, h: 56, cls: "dashed", html: "AGOV login<small>planned for the new service</small>" })
    .box("case", { x: 690, y: 160, w: 210, h: 64, html: `Caseworkers<small>${D.problem.caseworkers}, Energy Office</small>` })
    .box("po", { x: 930, y: 160, w: 200, h: 64, html: "Product owner<small>Energy Office</small>" })
    .box("legal", { x: 930, y: 276, w: 200, h: 56, html: "Legal service<small>reads the ordinance</small>" })
    .box("it", { x: 930, y: 392, w: 200, h: 56, html: "IT provider<small>hosting, AGOV</small>" })
    .box("system", { x: 380, y: 588, w: 220, h: 60, cls: "dark", html: `Case system<small>from ${D.years.caseSystem}</small>` })
    .box("batch", { x: 660, y: 588, w: 220, h: 60, cls: "dark", html: "Nightly batch import<small>once a day</small>" })
    .box("vendor", { x: 930, y: 588, w: 200, h: 60, html: "Case-system vendor<small>fixed contract</small>" });

  d.wire("owner", "installer", { from: "b", to: "t", label: "quote, data", arrow: false })
    .wire("owner", "pdf", { ft: 0.5, tt: 0.35, mid: 315, label: "signs", labelAt: [288, 178] })
    .wire("installer", "pdf", { ft: 0.5, tt: 0.75, mid: 337, label: "fills in", labelAt: [298, 392] })
    .wire("pdf", "inbox", { from: "b", to: "t", label: "e-mailed", labelAt: [520, 219] })
    .wire("inbox", "case", { tt: 0.45, mid: 635 })
    .wire("phone", "case", { tt: 0.8, mid: 652, cls: "soft" })
    .wire("legal", "case", { from: "l", to: "b", tt: 0.8, arrow: false })
    .wire("case", "batch", { from: "b", to: "t", ft: 0.3, tt: (753 - 660) / 220, label: "re-keys every case", labelAt: [753, 462] })
    .wire("batch", "system", { from: "l", to: "r" })
    .path("M1030 648V676H490V648", "dashed", false);

  // Constraint pins on the nodes they bind.
  const pin = (x, y, text) => d.at(x, y, `<span class="pin">${text}</span>`);
  pin(205, 152, "Law");
  pin(520, 142, "DE/FR");
  pin(475, 476, "Accessibility");
  pin(505, 396, "AGOV");
  pin(820, 580, "Legacy");
  pin(1060, 580, "Procurement");
  d.at(760, 676, `<span class="d-label" style="position:static;transform:none;display:inline-block">maintains</span>`);
  d.at(1010, 540, `<span class="label limit" style="font-size:12px;background:var(--color-paper-dusk);padding:0 8px">Status known only after the nightly import</span>`);
</script>
