<!-- The team's rhythm over one quarter: crit every week, a research day every month and a showcase
     at the end of the quarter. Weeks as columns, rituals as rows; slots nothing else may book. -->
<style>
  .cal {
    position: absolute;
    inset: 0;
    padding: 24px 30px 18px;
  }
  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }
  .top p {
    margin-top: 4px;
  }
  .grid {
    display: grid;
    grid-template-columns: 250px repeat(13, 1fr);
    margin-top: 18px;
    border-top: 1.5px solid var(--color-ground);
  }
  .grid > * {
    min-height: 34px;
    border-bottom: 1px solid rgb(90 92 82 / 0.35);
  }
  .wk {
    display: grid;
    place-items: center;
    color: var(--color-sheet-ink);
    font-family: var(--label);
    font-size: 11px;
    font-stretch: var(--label-wdth);
  }
  .month {
    grid-column: span 4;
    display: flex;
    align-items: center;
    padding-left: 8px;
    border-left: 1px solid rgb(90 92 82 / 0.35);
    font-family: var(--label);
    font-size: 11.5px;
    font-stretch: var(--label-wdth);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .month.last {
    grid-column: span 5;
  }
  .name {
    display: grid;
    align-content: center;
    gap: 2px;
    min-height: 88px;
    padding-right: 12px;
  }
  .name b {
    font-size: 16px;
  }
  .name span {
    color: var(--color-sheet-ink);
    font-size: 12.5px;
    line-height: 1.3;
  }
  .slot {
    display: grid;
    place-items: center;
    min-height: 88px;
  }
  .slot i {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--color-ground);
    color: var(--color-sheet);
    font-family: var(--label);
    font-size: 10px;
    font-style: normal;
    font-stretch: var(--label-wdth);
  }
  .slot i.research {
    width: 44px;
    background: var(--color-moss-ink);
  }
  .slot i.show {
    width: 54px;
    background: #fff;
    border: 2.5px solid var(--color-moss-ink);
    color: var(--color-moss-ink);
    font-weight: 700;
  }
  .foot {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
  }
</style>
<div class="cal">
  <div class="top">
    <div>
      <h1 class="title">The team’s rhythm, one quarter</h1>
      <p class="label muted">Booked a year ahead · nothing else may take these slots</p>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="foot label muted">
    <span>Crit: written notes, one owner per follow-up, the presenter decides what to take</span>
    <span>Pool: citizens who agreed to be contacted</span>
  </div>
</div>
<script>
  const R = window.DATA.rituals;
  const g = document.getElementById("grid");
  const weeks = 13;
  let html = `<div class="wk"></div>`;
  ["Month one", "Month two", "Month three"].forEach((m, i) => (html += `<div class="month ${i === 2 ? "last" : ""}">${m}</div>`));
  html += `<div class="wk"></div>` + Array.from({ length: weeks }, (_, i) => `<div class="wk">W${i + 1}</div>`).join("");
  const row = (title, sub, mark) => {
    html += `<div class="name"><b>${title}</b><span>${sub}</span></div>`;
    for (let w = 0; w < weeks; w++) html += `<div class="slot">${mark(w) ?? ""}</div>`;
  };
  row("Weekly crit", `${R.critMinutes} minutes, every week, all ${window.DATA.team.end} of us`, () => `<i>${R.critMinutes}′</i>`);
  row("Research day", `Monthly, from a pool of ${R.poolCitizens} citizens`, (w) => (w % 4 === 2 && w < 12 ? `<i class="research">Day</i>` : null));
  row("Showcase", "Quarterly, open to every product team", (w) => (w === weeks - 1 ? `<i class="show">Show</i>` : null));
  g.innerHTML = html;
</script>
