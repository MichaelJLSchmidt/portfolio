# Pull-request checks: lint, types and a production build under the Pages sub-path.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          MOTION_TOKEN: ${{ secrets.MOTION_TOKEN }}

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:contrast

      # Lists the content placeholders still to fill (informational; production builds fail on them).
      - run: npm run check:content

      - name: Build with the Pages base path
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_PREVIEW: "1"

      - name: Report bundle and asset sizes
        run: npm run report:size
